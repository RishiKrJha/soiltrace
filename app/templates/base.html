<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock %} - SoilTrace
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/navbar.js') }}" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="{{ url_for('index') }}">SoilTrace</a>
            </div>
            <button class="navbar-toggler" type="button" aria-label="Toggle navigation" aria-controls="main-navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="navbar-collapse" id="main-navigation">
                <ul class="navbar-nav">
                    <li><a href="{{ url_for('index') }}" class="nav-link{% if request.endpoint == 'index' %} active{% endif %}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Home</a></li>
                    <li><a href="{{ url_for('report') }}" class="nav-link{% if request.endpoint == 'report' %} active{% endif %}"{% if request.endpoint == 'report' %} aria-current="page"{% endif %}>Report</a></li>
                    <li><a href="{{ url_for('dashboard') }}" class="nav-link{% if request.endpoint == 'dashboard' %} active{% endif %}"{% if request.endpoint == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages" aria-live="polite">
                {% for category, message in messages %}
                    <p class="flash-message {{ category }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
